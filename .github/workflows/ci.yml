name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups
      # pyproject.toml sets `fix = true`; never auto-fix in CI
      - run: uv run ruff check --no-fix --output-format=github .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked --all-groups
      # Override addopts to skip the local HTML coverage report
      - run: >-
          uv run pytest -o addopts="" --cov=wabdd --cov-report=term-missing
          --junitxml=junit/test-results-${{ matrix.python-version }}.xml tests
      # Consumed by test-results.yml to publish results on the PR
      - uses: actions/upload-artifact@v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: test-results-${{ matrix.python-version }}
          path: junit/*.xml

  event-file:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: event-file
          path: ${{ github.event_path }}
